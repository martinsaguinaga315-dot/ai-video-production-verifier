name: Windows build

on:
  push:
    branches: [feature/ai-creator-v0.3.0]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve version
        shell: pwsh
        run: '"VERSION=$((python -c "from app_version import VERSION; print(VERSION)").Trim())" >> $env:GITHUB_ENV'
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes
      - name: Build and verify Windows artifacts
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-v${{ env.VERSION }}
          path: |
            release/AI-Video-Production-Verifier-Portable-v${{ env.VERSION }}.zip
            release/AI-Video-Production-Verifier-Setup-v${{ env.VERSION }}.exe
            release/SHA256SUMS.txt
            release/release_manifest_v${{ env.VERSION }}.json
