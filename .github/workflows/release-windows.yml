name: Release Windows

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve and verify version
        shell: pwsh
        run: |
          $version=(python -c "from app_version import VERSION; print(VERSION)").Trim(); $tag='${{ github.ref_name }}'
          if($tag -ne "v$version"){throw "Tag $tag does not match app version $version"}; "VERSION=$version" >> $env:GITHUB_ENV
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes
      - name: Rebuild and verify release artifacts
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          name: AI Video Production Verifier v${{ env.VERSION }}
          body: |
            Windows x64 desktop distribution for AI Video Production Verifier.
            Includes creator mode, professional JSON mode, local hard rules, optional DeepSeek semantic audit, installer, portable ZIP, privacy notes, and known limitations.
          files: |
            release/AI-Video-Production-Verifier-Portable-v${{ env.VERSION }}.zip
            release/AI-Video-Production-Verifier-Setup-v${{ env.VERSION }}.exe
            release/SHA256SUMS.txt
            release/release_manifest_v${{ env.VERSION }}.json
